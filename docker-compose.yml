version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: smartlog_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartlog
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: smartlog_app
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env